manifest_version: 1
name: notion
description: Search and update Notion pages, databases, and workspace content.
source: https://developers.notion.com/guides/mcp/get-started-with-mcp
transport:
  type: http
  url: https://mcp.notion.com/mcp
auth:
  type: oauth
post_install: |
  Use Authenticate in the dashboard MCP page to connect your Notion workspace.
  Then start a new Hermes session to load its tools.
