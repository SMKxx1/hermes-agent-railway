name: Railway CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only reads the checkout and reports checks.
permissions:
  contents: read

jobs:
  public-deploy-contracts:
    name: Public deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream's own setup step: the locked Python 3.14 toolchain from pm/lock.json plus an
      # isolated test environment (the same one upstream's Tests workflow uses).
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["web", "messaging"]'
          test-environment: 'true'

      - name: Run public deployment and auth contracts
        run: >-
          scripts/run_tests.sh -j 3
          tests/hermes_cli/test_railway_bootstrap.py
          tests/hermes_cli/test_railway_execution.py
          tests/hermes_cli/test_mcp_catalog.py
          tests/hermes_cli/test_mcp_config.py
          tests/hermes_cli/test_mcp_security.py
          tests/hermes_cli/test_dashboard_auth_middleware.py
          tests/hermes_cli/test_dashboard_auth_cookies.py
          tests/hermes_cli/test_dashboard_auth_gate.py
          tests/hermes_cli/test_dashboard_auth_password_login.py
          tests/hermes_cli/test_dashboard_auth_totp_login.py
          tests/hermes_cli/test_web_server_files.py
          tests/test_tui_gateway_attachment_safety.py
          tests/gateway/test_weak_credential_guard.py
          tests/gateway/test_telegram_audio_vs_voice.py
          tests/gateway/test_railway_qwen_stt.py
          tests/hermes_cli/test_sessions_export_md_cli.py
          tests/plugins/dashboard_auth/test_totp_provider.py

  railway-image-contract:
    name: Railway image contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared pytest fixtures import Hermes config even for Docker tests.
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["web", "messaging"]'
          test-environment: 'true'

      - name: Build local Railway image
        env:
          IMAGE: hermes-public-contract:${{ github.sha }}
        run: docker build --build-arg HERMES_CUSTOM_REVISION="${{ github.sha }}" --build-arg HERMES_SOURCE_URL="https://github.com/${{ github.repository }}" -f Dockerfile.railway -t "$IMAGE" .

      - name: Run Docker contracts
        env:
          HERMES_TEST_IMAGE: hermes-public-contract:${{ github.sha }}
        run: scripts/run_tests.sh -j 1 --file-timeout 300 tests/docker/test_railway_image_contract.py
