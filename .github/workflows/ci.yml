name: CI

on:
  push:
  pull_request:

# This workflow only reads the checkout and reports checks.
permissions:
  contents: read

jobs:
  public-deploy-contracts:
    name: Public deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Create test environment
        run: python -m venv .venv

      - name: Install locked project test dependencies
        run: >-
          .venv/bin/python -m pip install --disable-pip-version-check
          uv==0.12.1 &&
          .venv/bin/uv sync --locked --extra dev --extra web --extra messaging

      - name: Run public deployment and auth contracts
        run: >-
          scripts/run_tests.sh -j 3
          tests/hermes_cli/test_railway_bootstrap.py
          tests/hermes_cli/test_dashboard_auth_middleware.py
          tests/hermes_cli/test_dashboard_auth_totp_login.py
          tests/plugins/dashboard_auth/test_totp_provider.py

      - name: Compile Railway auth and bootstrap modules
        run: .venv/bin/python -m compileall -q scripts/railway_bootstrap.py plugins/dashboard_auth/totp

  railway-image-contract:
    name: Railway image contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Create test environment
        run: python -m venv .venv

      # The shared pytest fixtures import Hermes config even for Docker tests.
      - name: Install locked project test dependencies
        run: >-
          .venv/bin/python -m pip install --disable-pip-version-check
          uv==0.12.1 &&
          .venv/bin/uv sync --locked --extra dev --extra web --extra messaging

      - name: Build local Railway image
        env:
          IMAGE: hermes-public-contract:${{ github.sha }}
        run: docker build --build-arg HERMES_CUSTOM_REVISION="${{ github.sha }}" --build-arg HERMES_SOURCE_URL="https://github.com/${{ github.repository }}" -t "$IMAGE" .

      - name: Run Docker contracts
        env:
          HERMES_TEST_IMAGE: hermes-public-contract:${{ github.sha }}
        run: scripts/run_tests.sh -j 1 --file-timeout 300 tests/docker/test_railway_image_contract.py
