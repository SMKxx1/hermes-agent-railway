name: Dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', website, scripts/whatsapp-bridge, plugins/platforms/photon/sidecar, .railway, nix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit locked dependencies, including development tools
        if: matrix.directory != 'nix'
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=low
      - name: Audit the vendored Nix build-tool lock
        if: matrix.directory == 'nix'
        run: |
          mkdir -p "$RUNNER_TEMP/node-gyp-audit"
          cp nix/node-gyp-11-4-0-package-lock.json "$RUNNER_TEMP/node-gyp-audit/package-lock.json"
          node -e 'const fs = require("fs"); const lock = JSON.parse(fs.readFileSync("nix/node-gyp-11-4-0-package-lock.json")); fs.writeFileSync(process.env.RUNNER_TEMP + "/node-gyp-audit/package.json", JSON.stringify(lock.packages[""]));'
          npm audit --prefix "$RUNNER_TEMP/node-gyp-audit" --package-lock-only --audit-level=low

  python-audit:
    name: Audit every Python lock entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install audit tools
        run: python -m pip install uv==0.12.1 pip-audit==2.10.1
      - name: Check lock consistency
        run: uv lock --check
      - name: Audit locked versions without installing project code
        run: python scripts/ci/audit_python_lock.py
