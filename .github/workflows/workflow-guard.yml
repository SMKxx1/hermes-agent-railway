name: Workflow guard

# Upstream workflow files are kept unchanged so syncs merge cleanly, but they
# are built for NousResearch/hermes-agent (its secrets, runners and release
# process). Disabling is reactive: a new workflow can start before GitHub
# registers it. Sweep on PR activity and again when Railway CI starts/finishes.
# Never check out or execute PR code in this privileged workflow.

on:
  push:
    branches: [main, 'sync/**']
  # The base workflow and write token are available even for conflicting PRs.
  # No paths filter: GitHub can truncate the file list on large upstream syncs.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [Railway CI]
    types: [requested, completed]
  workflow_dispatch:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  guard:
    name: Keep upstream workflows disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: >-
        .github/workflows/railway-ci.yml
        .github/workflows/railway-security.yml
        .github/workflows/upstream-sync.yml
        .github/workflows/workflow-guard.yml
    steps:
      - name: Disable upstream workflows
        run: |
          set -euo pipefail
          keep=" $KEEP "
          workflows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | select(.path | startswith(".github/workflows/")) | [.id, .path] | @tsv')
          while IFS=$'\t' read -r id path; do
            [ -n "$id" ] || continue
            case "$keep" in *" $path "*) continue ;; esac
            echo "Disabling $path"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
          done <<< "$workflows"

          # Disabling does not stop existing runs, including runs that appear
          # after an earlier guard disabled their workflow. Collect every page
          # before cancelling, so removals cannot shift the pagination window.
          for status in queued in_progress waiting pending requested; do
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.path | startswith(".github/workflows/")) | [.id, .path] | @tsv')
            while IFS=$'\t' read -r run path; do
              [ -n "$run" ] || continue
              case "$keep" in *" $path "*) continue ;; esac
              echo "Cancelling $path run $run"
              if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null; then
                # A run can finish between the list and cancel requests. Other
                # errors (such as missing permissions) must fail visibly.
                [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" = completed ]
              fi
            done <<< "$runs"
          done
