name: Upstream sync

# Weekly: collects new NousResearch/hermes-agent commits into one pull request, up to the
# commit its published :main image was built from (Dockerfile.railway layers on that image).
# Nothing reaches main until that pull request is merged by hand.
#
# Merge sync pull requests with "Create a merge commit". Squash and rebase
# merges are disabled in the repository settings because they would cut the
# link to upstream history and make every later sync conflict.
#
# Requires a SYNC_TOKEN secret: a fine-grained personal access token for this
# repository only, with Contents, Pull requests and Workflows set to
# read/write. The default GITHUB_TOKEN cannot push upstream commits that change
# workflow files, and pull requests it opens do not trigger Railway CI.

on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 01:00 UTC (09:00 Singapore)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync

env:
  UPSTREAM_REPO: NousResearch/hermes-agent
  MIRROR_BRANCH: upstream-main # exact copy of upstream main
  SYNC_BRANCH: sync/upstream-auto # main + upstream, when they merge cleanly

jobs:
  sync:
    name: Queue upstream changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a SYNC_TOKEN repository secret (see the comment at the top of upstream-sync.yml)."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      # The Railway image is a thin layer on nousresearch/hermes-agent, so source and base image
      # must match: sync to the upstream commit the published :main image was built from, and
      # pin that image in the same pull request.
      - name: Resolve the upstream image and its source commit
        id: image
        run: |
          set -euo pipefail
          resolved=$(python3 scripts/railway_base_image.py resolve --tag main)
          echo "digest=$(echo "$resolved" | jq -r .digest)" >> "$GITHUB_OUTPUT"
          echo "revision=$(echo "$resolved" | jq -r .revision)" >> "$GITHUB_OUTPUT"
          echo "pinned=$(python3 scripts/railway_base_image.py current)" >> "$GITHUB_OUTPUT"
          echo "$resolved"

      - name: Fetch upstream
        run: git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "+main:refs/remotes/upstream/main"

      - name: Update mirror branch and sync pull request
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.image.outputs.revision }}
          PINNED: ${{ steps.image.outputs.pinned }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$REVISION" upstream/main; then
            echo "::error::Image revision $REVISION is not on $UPSTREAM_REPO main"
            exit 1
          fi
          behind=$(git rev-list --count "main..$REVISION")
          echo "main is $behind commits behind $UPSTREAM_REPO@$REVISION (image $DIGEST, pinned $PINNED)"
          if [ "$behind" = 0 ] && [ "$DIGEST" = "$PINNED" ]; then
            exit 0
          fi

          git push --force origin "$REVISION:refs/heads/$MIRROR_BRANCH"

          # Author commits as the token owner so the contributor list is unchanged.
          git config user.name "$(gh api user --jq .login)"
          git config user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"

          short=$(git rev-parse --short=10 "$REVISION")
          refresh=$(date -u +%F)
          pin_cmd="python3 scripts/railway_base_image.py pin $DIGEST --refresh $refresh"
          title="Sync with $UPSTREAM_REPO ($behind new commits)"
          compare="https://github.com/$UPSTREAM_REPO/compare/$(git merge-base main "$REVISION")...$short"
          summary="Brings in $behind new commits from $UPSTREAM_REPO up to \`$short\` ([changes]($compare)), the commit its published \`:main\` image was built from, and pins that image (\`$DIGEST\`) in \`Dockerfile.railway\`."

          merged=true
          if [ "$behind" != 0 ]; then
            git merge --no-ff --no-edit -m "Merge $UPSTREAM_REPO@$short" "$REVISION" || merged=false
          fi
          if [ "$merged" = true ]; then
            if [ "$(python3 scripts/railway_base_image.py pin "$DIGEST" --refresh "$refresh")" = changed ]; then
              git commit -qam "Pin the Railway base image to $UPSTREAM_REPO@$short"
            fi
            git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
            head="$SYNC_BRANCH"; stale="$MIRROR_BRANCH"
            body=$(printf '%s\n' "$summary" "" \
              "Merges cleanly. Review Railway CI, then merge with **Create a merge commit**.")
          else
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            git push origin --delete "$SYNC_BRANCH" 2>/dev/null || true
            head="$MIRROR_BRANCH"; stale="$SYNC_BRANCH"
            body=$(printf '%s\n' "$summary" "" \
              "**Conflicts with main in:**" \
              "$conflicts" \
              "" \
              "Resolve on a separate branch (this job only rewrites \`$MIRROR_BRANCH\` and \`$SYNC_BRANCH\`):" \
              "" \
              '```bash' \
              "git fetch origin main $MIRROR_BRANCH" \
              "git switch -c sync/upstream-manual origin/main" \
              "git merge origin/$MIRROR_BRANCH" \
              "# resolve, then pin the matching base image:" \
              "$pin_cmd" \
              "# run the Railway tests, commit" \
              "git push -u origin sync/upstream-manual" \
              '```' \
              "" \
              "Open a pull request from that branch, merge it with **Create a merge commit**, and close this one.")
          fi

          for number in $(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$stale" --state open --json number --jq '.[].number'); do
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Superseded by the latest upstream sync."
          done
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$head" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$head" --title "$title" --body "$body"
          fi
